<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/SignUp</title>
    <link rel = "stylesheet" type = "text/css" href = "LoginSignUpStyle.css">
</head>
<body>
    
    <div class = "OuterDiv">
        <div class = "LoginDiv"><!--Div to Store The Entire Login Form-->
            <form action = ""><!--Login Form -->
                <h1>Login</h1><!--HEading for Login form-->
                <br>
                <div class = "UserInput"><!--Div to hold user input box for username-->
                    <input type = "text" placeholder = "Username" required>
                </div>

                <div class = "UserInput"><!--Div to hold user input box for Password-->
                    <input type = "password" placeholder = "Password" required>
                </div>
                
                <button class = "LoginBtn">Login</button>

            </form>

        </div>


         <div class = "SignUpDiv"><!--Div to Store The Entire Sign Up Form-->
            <form action = ""><!--Login Form -->
                <h1>SignUp</h1><!--HEading for Sign Up form-->
                <br>
                <div class = "UserInput"><!--Div to hold user input box for username-->
                    <input type = "text" placeholder = "Username" required>
                </div>

                <div class = "UserInput"><!--Div to hold user input box for Password-->
                    <input type = "password" placeholder = "Password" required>
                </div>

                <div class = "UserInput"><!--Div to hold user input box for Password-->
                    <input type = "text" placeholder = "Company" required>
                </div>

                <div class = "UserInput"><!--Div to hold user input box for Password-->
                    <input type = "text" placeholder = "Project ID" required>
                </div>
                
                <button class = "SignUpBtn">SignUp</button>

            </form>

        </div>

        <div class = "Mover">
            <div class = "MoverPanel Mover-Left"><!--Sign Up Form Promp div-->
                <h1>How u Boyyy</h1>
                 <p>Vye in the pozie to catch one chow</p>
                <button class = "LoginPromptBtn">Log In</button>
            </div>

            <div class = "MoverPanel Mover-Right"><!--Login Form Prompt div-->
                <h1>Wk Ekse</h1>
                <p>Check here larnie, dala one account if you dont have one</p>
                
              <button class = "SignUpPromptBtn">Sign Up</button> 
                
            </div>
        </div>



    </div>

    <script src = "LoginSignUp.js"></script>
</body>
</html>
