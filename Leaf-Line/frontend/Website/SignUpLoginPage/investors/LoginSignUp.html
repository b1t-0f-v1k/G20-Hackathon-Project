<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Investor Login/SignUp</title>
    <link rel="stylesheet" href="LoginSignUpStyle.css" />
</head>
<body>
    <div class="OuterDiv">
        <div class="LoginDiv">
            <form id="loginForm" action="">
                <h1>Login</h1>
                <br />
                <div class="UserInput">
                    <label for="email-input">
                        <img src="../assets/email.png" alt="Email Icon" style="height: 20px; width: 25px;" />
                    </label>
                    <input type="email" id="email-input" name="email" placeholder="Email" required />
                </div>
                <div class="UserInput">
                    <label for="password-input">
                        <img src="../assets/padlock.png" alt="Password Icon" style="height: 20px; width: 25px;" />
                    </label>
                    <input
                        type="password"
                        id="password-input"
                        name="password"
                        placeholder="Password"
                        required
                    />
                    <br>
                    <input type="checkbox" id="show-login-password" />
                    <label for="show-login-password" style="font-size: 12px; color: #555; cursor: pointer;">Show Password</label>
                </div>
                <button class="LoginBtn" type="submit">Login</button>
            </form>
        </div>

        <div class="SignUpDiv">
            <form id="signupForm" action="">
                <h1>SignUp</h1>
                <br />
                <div class="UserInput">
                    <label for="signup-name-input">
                        <img src="../assets/user.png" alt="User Icon" style="height: 20px; width: 25px;" />
                    </label>
                    <input
                        type="text"
                        id="signup-name-input"
                        name="user"
                        placeholder="Username"
                        required
                    />
                </div>

                <div class="UserInput">
                    <label for="signup-email-input">
                        <img src="../assets/email.png" alt="Email Icon" style="height: 20px; width: 25px;" />
                    </label>
                    <input
                        type="email"
                        id="signup-email-input"
                        name="email"
                        placeholder="Email"
                        required
                    />
                </div>

                <div class="UserInput">
                    <label for="signup-password-input">
                        <img src="../assets/padlock.png" alt="Password Icon" style="height: 20px; width: 25px;" />
                    </label>
                    <input
                        type="password"
                        id="signup-password-input"
                        name="password"
                        placeholder="Password"
                        required
                    />
                    <input type="checkbox" id="show-signup-password" />
                    <label for="show-signup-password" style="font-size: 12px; color: #555; cursor: pointer;">Show Password</label>
                </div>

                <button class="SignUpBtn" type="submit">SignUp</button>
            </form>
        </div>

        <div class="Mover">
            <div class="MoverPanel Mover-Left">
                <h1>How u Boyyy</h1>
                <p>Vye in the pozie to catch one chow</p>
                <button class="LoginPromptBtn">Log In</button>
            </div>
            <div class="MoverPanel Mover-Right">
                <h1>Wk Ekse</h1>
                <p>Check here larnie, dala one account if you dont have one</p>
                <button class="SignUpPromptBtn">Sign Up</button>
            </div>
        </div>
    </div>

    <script type="module" src="../utilities/signup.js"></script>
    <script type="module" src="./LoginSignUp.js"></script>
    <script type="module" src="../utilities/login.js"></script>
</body>
</html>
