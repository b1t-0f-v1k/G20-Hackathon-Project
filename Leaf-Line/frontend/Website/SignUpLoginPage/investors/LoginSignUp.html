<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/SignUp</title>
    <link rel = "stylesheet" type = "text/css" href = "LoginSignUpStyle.css">
</head>
<body>
    <!--<div class="top-center-banner">
        <img src="Adobe Express - file.png" alt="User Icon" style="height: 500px; width: 800px;">
        <span>Find your <span class="leafline-text">LEAF-LINE</span>, Chart Your Path.</span>
    </div>-->
    <div class = "OuterDiv">
        <div class = "LoginDiv"><!--Div to Store The Entire Login Form-->
            <form action = "" id="loginForm"><!--Login Form -->
                <h1>Login</h1><!--HEading for Login form-->
                <br>
                <div class = "UserInput"><!--Div to hold user input box for email-->
                    <Label for="email-input">
                        <img src="../assets/email.png" alt="Label Icon" style="height: 20px;width: 25px;">
                    </Label>
                    <input type="email" name="email" id="email-input" placeholder="Email" required>
                </div>

                <div class = "UserInput"><!--Div to hold user input box for Password-->
                    <Label for="password-input">
                        <img src="../assets/padlock.png" alt="Label Icon" style="height: 20px; width: 25px;">
                    </Label>
                    <input type = "password" name="password" id="password-input" placeholder = "Password" required>
                </div>
        
                <button class = "LoginBtn" type="submit">Login</button>

            </form>
        </div>


        <div class = "SignUpDiv"><!--Div to Store The Entire Login Form-->
            <form action = "" id="signupForm"><!--sign up Form -->
                <h1>SignUp</h1><!--HEading for sign up form-->
                <br>
                <div class = "UserInput"><!--Div to hold user input box for username-->
                    <Label for="user-input">
                        <img src="../assets/user.png" alt="Label Icon" style="height: 20px; width: 25px;">
                    </Label>
                    <input type = "text" name="user" id="user-input2" placeholder = "Username" required>
                </div>
                <div class = "UserInput"><!--Div to hold user input box for Email-->
                    <Label for="email-input">
                        <img src="../assets/email.png" alt="Label Icon" style="height: 20px; width: 25px;">
                    </Label>
                    <input type="email" name="email" id="email-input" placeholder="Email">
                </div>

                <div class = "UserInput"><!--Div to hold user input box for Password-->
                    <Label for="password-input">
                        <img src="../assets/padlock.png" alt="Label Icon" style="height: 20px; width: 25px;">
                    </Label>
                    <input type = "password" name="password" id="password-input2" placeholder = "Password" required>
                </div>

                <button class = "SignUpBtn">SignUp</button>

            </form>

        </div>

        <div class = "Mover">
            <div class = "MoverPanel Mover-Left"><!--Sign Up Form Promp div-->
                <h1>How u Boyyy</h1>
                 <p>Vye in the pozie to catch one chow</p>
                <button class = "LoginPromptBtn">Log In</button>
            </div>

            <div class = "MoverPanel Mover-Right"><!--Login Form Prompt div-->
                <h1>Wk Ekse</h1>
                <p>Check here larnie, dala one account if you dont have one</p>
                
              <button class = "SignUpPromptBtn">Sign Up</button> 
                
            </div>
        </div>



    </div>

    <script type="module" src = "../signup.js"></script>
    <script type="module" src = "LoginSignUp.js"></script>
    <script type="module" src = "../login.js"></script>
</body>
</html>
