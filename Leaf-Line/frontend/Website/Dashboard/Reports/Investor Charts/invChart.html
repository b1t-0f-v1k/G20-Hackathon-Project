<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment Portfolio Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="./invChart.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- Add this right after the opening <body> tag -->
    <div class="back-button-container">
    <a href="../Investors/InvestorDashboard.html" class="back-button">
        <i class="fas fa-arrow-left"></i> Back to Dashboard
    </a>
    </div>

    <div id="authContainer" class="auth-container">
        <div class="auth-box">
            <h2>Investor Login</h2>
            <form id="authForm">
                <div class="form-group">
                    <label for="investorIdInput">Investor ID:</label>
                    <input type="text" id="investorIdInput" placeholder="Enter your Investor ID" required>
                </div>
                <button type="submit" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> View Dashboard
                </button>
            </form>
        </div>
    </div>
    
    <div class="topbar">
        <div class="main">
            <h1>Investment Portfolio Dashboard</h1>
            <div class="investor-info">
                <span id="investorName">Investor</span>
                <span id="investorID">ID: Loading...</span>
            </div>
        </div>

        <div id="input-section">
            <button id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>
    </div>

    <div class="summary-cards">
        <div class="card">
            <div class="card-title">Total Invested</div>
            <div class="card-value" id="totalInvested">ZAR 0</div>
        </div>
        <div class="card">
            <div class="card-title">Active Projects</div>
            <div class="card-value" id="activeProjects">0</div>
        </div>
        <div class="card">
            <div class="card-title">CO₂ Offset</div>
            <div class="card-value" id="totalEmissions">0 kg</div>
        </div>
    </div>

    <div class="dashboard-controls">
        <button class="chart-toggle active" data-chart="overview">Overview</button>
        <button class="chart-toggle" data-chart="breakdown">Breakdown</button>
        <button class="chart-toggle" data-chart="performance">Performance</button>
        <button class="chart-toggle" data-chart="geographic">Geographic</button>
    </div>

    <div class="dashboard-container">
        <div class="chart-section" id="overview-section">
            <div class="chart-container">
                <canvas id="investmentAmountChart"></canvas>
            </div>
            <div class="chart-container">
                <canvas id="investmentDistributionChart"></canvas>
            </div>
        </div>

        <div class="chart-section hidden" id="breakdown-section">
            <div class="chart-container full-width">
                <canvas id="sectorBreakdownChart"></canvas>
            </div>
        </div>

        <div class="chart-section hidden" id="performance-section">
            <div class="chart-container">
                <canvas id="roiChart"></canvas>
            </div>
            <div class="chart-container">
                <canvas id="costEfficiencyChart"></canvas>
            </div>
        </div>

        <div class="chart-section hidden" id="geographic-section">
            <div class="chart-container full-width">
                <canvas id="provinceDistributionChart"></canvas>
            </div>
        </div>
    </div>

    <script src="./invChart.js"></script>
</body>
</html>
