<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SME Projects</title>
  <link rel="stylesheet" href="smeProjects.css">
</head>
<body>
  <div class="header-container">
    <h1>SME Projects</h1>
    <div class="flag-key">
      <h3>Status Key:</h3>
      <div class="key-item"><span class="key-color green"></span>Green: Below target</div>
      <div class="key-item"><span class="key-color yellow"></span>Yellow: Near target</div>
      <div class="key-item"><span class="key-color orange"></span>Orange: Approaching limit</div>
      <div class="key-item"><span class="key-color red"></span>Red: Above limit</div>
      <div class="key-item"><span class="key-color no-data"></span>No data</div>
    </div>
  </div>
  
  <div class="search-container">
    <input type="text" id="businessID" placeholder="Enter Business ID" />
    <select id="statusFilter">
      <option value="">All Statuses</option>
      <option value="active">Active</option>
      <option value="completed">Completed</option>
      <option value="cancelled">Cancelled</option>
    </select>
    <button id="loadProjects">Load Projects</button>
  </div>
  <div id="projectsList"></div>

  <script src="smeProjects.js"></script>
</body>
</html>
