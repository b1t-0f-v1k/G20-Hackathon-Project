<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Carbon Investments</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./myInvestments.css">
</head>
<body>
  <div class="investments-container">
    <header class="investments-header">
      <h1><i class="fas fa-chart-line"></i> My Carbon Investments</h1>
      <div class="investor-info">
        <span id="investorName">Loading...</span>
        <span id="investorID">ID: Loading...</span>
      </div>
    </header>

    <div class="dashboard-summary">
      <div class="summary-card">
        <div class="summary-icon">
          <i class="fas fa-wallet"></i>
        </div>
        <div class="summary-content">
          <h3>Total Invested</h3>
          <p id="totalInvested">ZAR 0.00</p>
        </div>
      </div>
      
      <div class="summary-card">
        <div class="summary-icon">
          <i class="fas fa-project-diagram"></i>
        </div>
        <div class="summary-content">
          <h3>Active Projects</h3>
          <p id="activeProjects">0</p>
        </div>
      </div>
      
      <div class="summary-card">
        <div class="summary-icon">
          <i class="fas fa-leaf"></i>
        </div>
        <div class="summary-content">
          <h3>CO₂ Offset</h3>
          <p id="totalEmissions">0 kg</p>
        </div>
      </div>
    </div>

    <div class="investments-controls">
      <div class="search-filter">
        <input type="text" id="searchInvestments" placeholder="Search projects...">
        <select id="filterStatus">
          <option value="">All Statuses</option>
          <option value="active">Active</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>
        <select id="sortInvestments">
          <option value="date:desc">Newest First</option>
          <option value="date:asc">Oldest First</option>
          <option value="amount:desc">Highest Amount</option>
          <option value="amount:asc">Lowest Amount</option>
        </select>
        <button id="refreshInvestments">
          <i class="fas fa-sync-alt"></i> Refresh
        </button>
      </div>
    </div>

    <div class="investments-list">
      <div class="list-header">
        <h2>Investment Portfolio</h2>
        <div class="list-count">
          <span id="investmentCount">0</span> investments
        </div>
      </div>
      
      <div id="investmentsTable" class="investments-table">
        <!-- Investments will be loaded here -->
      </div>
    </div>

    <div id="investmentDetailsModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2 id="modalProjectTitle">Project Details</h2>
        <div class="modal-body" id="investmentDetailsContent">
          <!-- Details will be loaded here -->
        </div>
      </div>
    </div>
  </div>

  <script src="./myInvestments.js"></script>
</body>
</html>
