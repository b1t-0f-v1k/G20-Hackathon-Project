<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SME Carbon Calculator</title>
  <link rel="stylesheet" href="../utilities/calculator.css" />
</head>
<body>
  <form id="sme-form">
    <h2>SME Carbon Calculator</h2>

    <input type="text" id="smeName" placeholder="Business Name" required />
    <input type="text" id="businessID" placeholder="Enter Business ID" required />
    <input type="text" id="projectName" placeholder="Project Name" required />

    <label for="province">Province:</label>
    <select id="province" required>
      <option value="">-- Select Province --</option>
    </select>

    <label for="municipality">Municipality:</label>
    <select id="municipality" required>
      <option value="">-- Select Municipality --</option>
    </select>
    <h3>Emission Sources</h3>
    <div id="sme-sources"></div>
    <button type="button" id="add-sme-source" disabled>+ Add Source</button>

    <button type="submit">Calculate</button>
  </form>

  <div id="sme-results" class="results"></div>

  <script src="../utilities/provinceMunicipalityData.js"></script>
  <script src="smeCalculator.js"></script>
</body>
</html>
