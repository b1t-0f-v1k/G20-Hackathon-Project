<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SME Carbon Calculator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./smeCalculator.css" />
</head>
<body>
  <div class="container">
    <div class="header-container">
      <h1><i class="fas fa-leaf"></i> SME Carbon Calculator</h1>
      <div class="flag-key">
        <h4><i class="fas fa-key"></i> Emission Status Key</h4>
        <div class="key-item"><span class="key-color green"></span>Green: Below target</div>
        <div class="key-item"><span class="key-color yellow"></span>Yellow: Near target</div>
        <div class="key-item"><span class="key-color orange"></span>Orange: Warning level</div>
        <div class="key-item"><span class="key-color red"></span>Red: Above limit</div>
      </div>
    </div>
    
    <div class="calculator-grid">
      <form id="sme-form" class="calculator-form">
        <h2><i class="fas fa-calculator"></i> Calculate Your Emissions</h2>

        <div class="form-group">
          <label for="smeName"><i class="fas fa-building"></i> Business Name</label>
          <input type="text" id="smeName" placeholder="Enter your business name" required />
        </div>

        <div class="form-group">
          <label for="businessID"><i class="fas fa-id-card"></i> Business ID</label>
          <input type="text" id="businessID" placeholder="Enter your business ID" required />
        </div>

        <div class="form-group">
          <label for="projectName"><i class="fas fa-project-diagram"></i> Project Name</label>
          <input type="text" id="projectName" placeholder="Enter project name" required />
        </div>

        <div class="form-group">
          <label for="projectDescription"><i class="fas fa-align-left"></i> Project Description</label>
          <textarea id="projectDescription" placeholder="Describe your project"></textarea>
        </div>

        <div class="form-group">
          <label for="projectCost"><i class="fas fa-money-bill-wave"></i> Project Cost (ZAR)</label>
          <input type="number" id="projectCost" placeholder="0.00" required min="0" step="0.01" />
        </div>

        <div class="form-group">
          <label for="province"><i class="fas fa-map-marker-alt"></i> Province</label>
          <select id="province" required>
            <option value="">-- Select Province --</option>
          </select>
        </div>

        <div class="form-group">
          <label for="municipality"><i class="fas fa-city"></i> Municipality</label>
          <select id="municipality" required>
            <option value="">-- Select Municipality --</option>
          </select>
        </div>

        <h3 class="section-title"><i class="fas fa-factory"></i> Emission Sources</h3>
        <div id="sme-sources" class="sources-container"></div>
        
        <button type="button" id="add-sme-source" class="btn-add-source" disabled>
          <i class="fas fa-plus-circle"></i> Add Emission Source
        </button>

        <button type="submit" class="btn-calculate">
          <i class="fas fa-calculator"></i> Calculate Carbon Footprint
        </button>
      </form>

      <div class="results-container" id="sme-results">
        <div class="results-header">
          <h3><i class="fas fa-chart-pie"></i> Carbon Footprint Results</h3>
          <div class="results-placeholder">
            <i class="fas fa-arrow-left"></i>
            <p>Complete the form to see your carbon footprint analysis</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="../utilities/provinceMunicipalityData.js"></script>
  <script src="smeCalculator.js"></script>
</body>
</html>
