<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lifestyle Carbon Calculator</title>
  <link rel="stylesheet" href="calculator.css">
</head>
<body>
  <form id="lifestyle-form">
    <h2>Lifestyle Carbon Calculator</h2>
    <input type="text" id="userId" placeholder="User ID" required>

    <h3>Categories</h3>
    <div id="lifestyle-categories"></div>
    <button type="button" id="add-lifestyle-category">+ Add Category</button>

    <button type="submit">Calculate</button>
  </form>

  <div id="lifestyle-results" class="results"></div>

  <script src="lifestyleCalculator.js"></script>
</body>
</html>
